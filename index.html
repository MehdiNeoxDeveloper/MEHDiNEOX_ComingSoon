<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEHDiNEOX // Coming Soon</title>

    <style>
        @font-face {
            font-family: 'VT323';
            src: url('fonts/title.woff2') format('woff2');
            font-display: swap;
        }

        @font-face {
            font-family: 'Press Start 2P';
            src: url('fonts/font.ttf') format('truetype');
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #050805;
            color: #00ff66;
            font-family: 'VT323', monospace;
            font-size: 18px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .terminal {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 600px;
            border: 1px solid #00ff66;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 25px #00ff6622;
        }

        .topbar {
            background: #102015;
            padding: 12px;
            border-bottom: 1px solid #00ff6644;
            color: #8affae;
            font-size: 16px;
        }

        .content {
            padding: 28px 22px;
            line-height: 1.6;
        }

        .brand {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(18px, 5.5vw, 28px);
            font-weight: normal;
            text-shadow: 0 0 12px #00ff66;
            margin: 18px 0;
        }

        .status {
            color: #ffffff;
            margin: 16px 0;
        }

        .orange {
            color: #ff7b00;
        }

        .cursor {
            display: inline-block;
            width: 9px;
            height: 18px;
            background: #00ff66;
            vertical-align: middle;
            animation: blink 1s steps(2) infinite;
        }

        .footer {
            margin-top: 28px;
            color: #63866c;
            font-size: 15px;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .terminal::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: #00ff66;
            box-shadow: 0 0 12px #00ff66;
            opacity: 0.65;
            pointer-events: none;
            animation: scan 5s linear infinite;
        }

        @keyframes scan {
            from {
                top: 0;
            }
            to {
                top: 100%;
            }
        }

        #matrix {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.22;
            z-index: 0;
        }

        #terminal-lines {
            min-height: 150px;
        }

        .clock-box {
            color: #8affae;
            font-size: 17px;
            line-height: 1.6;
            border-left: 2px solid #00ff66;
            padding-left: 12px;
            margin: 18px 0 24px;
        }

        #clock {
            color: #ffffff;
        }

        #date {
            color: #ff9f40;
        }

        .enter-btn {
            display: block;
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            color: #00ff66;
            background: #07130a;
            border: 1px solid #00ff66;
            border-radius: 5px;
            font-family: 'VT323', monospace;
            font-size: 20px;
            cursor: pointer;
            transition: 0.25s;
        }

        .enter-btn:hover,
        .enter-btn:active {
            background: #00ff66;
            color: #050805;
            box-shadow: 0 0 18px #00ff6677;
        }

        #system-message {
            display: none;
            color: #ff9f40;
            margin-top: 15px;
            font-size: 17px;
            overflow-wrap: anywhere;
        }

        .topbar {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .status-light {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #00ff66;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff66;
            animation: onlineBlink 1.2s ease-in-out infinite;
        }

        @keyframes onlineBlink {
            0%, 100% {
                opacity: 1;
                box-shadow: 0 0 8px #00ff66;
            }
            50% {
                opacity: 0.25;
                box-shadow: 0 0 2px #00ff66;
            }
        }

        .topbar span:last-child {
            margin-left: auto;
        }

        @media (prefers-reduced-motion: reduce) {
            .terminal::after,
            .cursor,
            .status-light {
                animation: none;
            }

            #matrix {
                display: none;
            }
        }
    </style>
</head>

<body>

    <canvas id="matrix"></canvas>
    <main class="terminal">
        <div class="topbar">
            <span class="status-light"></span>
            <span>SYSTEM ONLINE</span>
            <span>MEHDiNEOX_TERMINAL</span>
        </div>

        <div class="content">
            <div id="terminal-lines"></div>
            <div class="clock-box">
                <div>LOCAL TIME: <span id="clock">--:--:--</span></div>
                <div>DATE: <span id="date">----</span></div>
            </div>

            <h1 class="brand">MEHDiNEOX</h1>

            <p class="status">[ COMING SOON ]</p>

            <p>
                A new digital experience is being built.
            </p>

            <p>
                Stay tuned<span class="orange">_</span>
                <span class="cursor"></span>
            </p>

            <button class="enter-btn" id="enter-btn">
                [ ENTER SYSTEM ]
            </button>

            <p id="system-message" aria-live="polite"></p>

            <div class="footer">
                © MEHDiNEOX | ALL SYSTEMS RESERVED
            </div>
        </div>
    </main>

<script>
    const lines = [
        "> Initializing system...",
        "> Loading personal portfolio...",
        "> Checking project status...",
        "> Status: IN DEVELOPMENT"
    ];

    const terminal = document.getElementById("terminal-lines");
    let lineIndex = 0;

    function typeLine() {
        if (lineIndex >= lines.length) return;

        const p = document.createElement("p");
        p.style.marginBottom = "8px";
        terminal.appendChild(p);

        const text = lines[lineIndex];
        let charIndex = 0;

        const typing = setInterval(() => {
            p.textContent += text[charIndex];
            charIndex++;

            if (charIndex >= text.length) {
                clearInterval(typing);
                lineIndex++;
                setTimeout(typeLine, 450);
            }
        }, 35);
    }

    typeLine();
</script>

<script>
(() => {
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");

    const chars = "01アイウエオカキクケコ";
    const fontSize = 14;
    let columns = 0;
    let drops = [];

    function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.floor(innerWidth * dpr);
        canvas.height = Math.floor(innerHeight * dpr);

        canvas.style.width = innerWidth + "px";
        canvas.style.height = innerHeight + "px";

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        columns = Math.ceil(innerWidth / fontSize);
        drops = Array.from(
            { length: columns },
            () => Math.random() * -50
        );
    }

    function draw() {
        ctx.fillStyle = "rgba(5, 8, 5, 0.12)";
        ctx.fillRect(0, 0, innerWidth, innerHeight);

        ctx.fillStyle = "#00ff66";
        ctx.font = fontSize + "px monospace";

        for (let i = 0; i < columns; i++) {
            const char = chars[
                Math.floor(Math.random() * chars.length)
            ];

            ctx.fillText(
                char,
                i * fontSize,
                drops[i] * fontSize
            );

            if (
                drops[i] * fontSize > innerHeight &&
                Math.random() > 0.975
            ) {
                drops[i] = 0;
            }

            drops[i] += 0.65;
        }
    }

    resize();
    window.addEventListener("resize", resize);

    let lastFrame = 0;

    function animate(time) {
        requestAnimationFrame(animate);

        if (time - lastFrame < 50) return;

        lastFrame = time;
        draw();
    }

    requestAnimationFrame(animate);
})();
</script>

<script>
    function updateClock() {
        const now = new Date();

        document.getElementById("clock").textContent =
            now.toLocaleTimeString("en-GB", {
                hour12: false
            });

        document.getElementById("date").textContent =
            now.toLocaleDateString("en-GB", {
                day: "2-digit",
                month: "short",
                year: "numeric"
            });
    }

    updateClock();
    setInterval(updateClock, 1000);

    document.getElementById("enter-btn").addEventListener(
        "click",
        function () {
            const message =
                document.getElementById("system-message");

            message.style.display = "block";
            message.textContent = "";

            const text = "> ACCESS GRANTED. WELCOME TO MEHDINEOX.";

            let i = 0;

            const typing = setInterval(function () {
                message.textContent += text[i];
                i++;

                if (i >= text.length) {
                    clearInterval(typing);
                }
            }, 35);

            this.textContent = "[ SYSTEM ACCESSED ]";
            this.disabled = true;
            this.style.opacity = "0.7";
        }
    );
</script>
</body>
</html>
